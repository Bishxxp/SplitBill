services:
  db:
    image: postgres:16
    container_name: splitbill_db
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: splitbill
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: